<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Бой next door</title>
  <link rel="stylesheet" href="styles/styles.css">
</head>

<body>
  <!-- Buttons -->
  <div id="bgControl">
    <select name="language" id="abc" onchange="languageChange()">
      <option value="ru">🇷🇺 Russian</option>
      <option value="en">🇬🇧 English</option>
      <option value="ger">🇩🇪 German</option>
      <option value="uk">🇺🇦 Ukrainian</option>
    </select>
    <button id="bgPrevButton">&lt;- Задний План</button>
    <button id="bgButton">Задний План -></button>

    <button id="elementButton">Элементы</button>
  </div>

  <div id="mobsbuttons">
    <button id="addEliteButton">Добавить Элиту</button>
    <div class="control-group">
      <button data-team="red" data-action="add">Враги +</button>
      <button data-team="red" data-action="remove">Враги -</button>
    </div>
    <div class="control-group">
      <button data-team="green" data-action="add">Союзники +</button>
      <button data-team="green" data-action="remove">Союзники -</button>
    </div>
  </div>
  <div id="characktersbuttons">
    <div class="control-group">
      <button data-team="initial" data-action="add">Добавить Персонаж</button>
    </div>
  </div>

  <div id="app"><canvas id="c"></canvas></div>

  <script src="scripts/boiscript.js"></script>
</body>

</html>
